<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#07101b">
<title>ARKANOID — 2.5D Classic</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070d18;color:#eef6ee;font-family:Arial,sans-serif;touch-action:none}
#wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center;position:relative;background:radial-gradient(ellipse at center,#102b35 0%,#070d18 72%)}
canvas{display:block;width:min(100vw,133.333vh);height:min(75vw,100vh);max-width:100vw;max-height:100vh;object-fit:contain;touch-action:none}
#mobile{position:absolute;bottom:max(12px,env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:center;gap:18px;pointer-events:none}
.ctrl{pointer-events:auto;width:68px;height:54px;border:1px solid #57cbd0;border-radius:14px;background:#0c2935cc;color:#eafafa;font-size:25px;font-weight:bold;box-shadow:0 4px 0 #06151c;user-select:none;-webkit-user-select:none}
#hint{position:absolute;top:max(8px,env(safe-area-inset-top));left:0;right:0;text-align:center;font-size:11px;color:#9bb9b9;opacity:.8;pointer-events:none}
@media(pointer:fine){#mobile{display:none}}
</style>
</head>
<body><div id="wrap"><div id="hint">MOVE: ARROWS / A-D / TOUCH · LAUNCH: SPACE / TAP · PAUSE: P</div><canvas id="game" width="960" height="720"></canvas><div id="mobile"><button class="ctrl" id="left">◀</button><button class="ctrl" id="launch">●</button><button class="ctrl" id="right">▶</button></div></div>
<script>
(() => {
'use strict';
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
const W=960,H=720,FPS=60,FW=800,FH=540,PY=492;
const CYAN=[87,225,232],WHITE=[238,246,238],GOLD=[255,206,82],WATER=[20,92,111],GRASS=[63,133,69],DARK=[7,13,24];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const mix=(a,b,t)=>a.map((v,i)=>Math.round(v*(1-t)+b[i]*t));
const rgb=c=>`rgb(${c[0]},${c[1]},${c[2]})`;
function project(x,y){const t=clamp(y/FH,0,1),half=315+90*t;return [Math.round(W/2+(x/FW-.5)*2*half),Math.round(105+y*.91)];}
function polyRect(x,y,w,h){return [project(x,y),project(x+w,y),project(x+w,y+h),project(x,y+h)];}
function polygon(points,fill,stroke=null,width=1){ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=width;ctx.stroke();}}
function line(a,b,color,width=1){ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke();}
function drawText(s,size,color,x,y,align='left',weight='normal'){ctx.font=`${weight} ${size}px Arial,sans-serif`;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillStyle=color;ctx.fillText(s,x,y);}
function background(){
 ctx.fillStyle=rgb(DARK);ctx.fillRect(0,0,W,H);
 for(let i=0;i<85;i++){const x=(i*137+29)%W,y=(i*83+17)%330;ctx.fillStyle=`rgb(${35+i*7%65},${75+i*11%90},${90+i*13%100})`;ctx.beginPath();ctx.arc(x,y,1+(i%19===0?1:0),0,Math.PI*2);ctx.fill();}
 ctx.fillStyle='#0a262f';ctx.beginPath();ctx.ellipse(480,145,380,90,0,0,Math.PI*2);ctx.fill();
 const water=[project(0,0),project(FW,0),project(FW,FH),project(0,FH)];polygon(water,rgb(WATER),'#248994',3);
 for(let x=0;x<=FW;x+=80)line(project(x,0),project(x,FH),'#1a707a',1);
 for(let y=0;y<=FH;y+=60)line(project(0,y),project(FW,y),'#1a707a',1);
 for(const side of [0,1])for(let i=0;i<4;i++){const x=side===0?-18:FW-112,y=55+i*125,p=polyRect(x,y,130,68);polygon(p.map(([a,b])=>[a,b+7]),'#235835');polygon(p,rgb(GRASS),'#67ae53',2);}
 const p=polyRect(285,18,230,58);polygon(p.map(([a,b])=>[a,b+7]),'#1a4533');polygon(p,rgb(GRASS));
 for(const [x,y,s] of [[335,38,1],[455,40,.8]]){const [px,py]=project(x,y);line([px,py],[px,py-24*s],'#5b3925',4);ctx.fillStyle='#1f5b33';ctx.beginPath();ctx.arc(px,py-34*s,17*s,0,Math.PI*2);ctx.fill();ctx.fillStyle='#519e4b';ctx.beginPath();ctx.arc(px-5,py-42*s,11*s,0,Math.PI*2);ctx.fill();}
}
function buildLevel(level){const colors=[[226,82,72],[235,139,67],[233,197,73],[92,181,101],[76,166,205],[151,111,204]],rows=5+Math.min(Math.floor((level-1)/2),2),cols=10,bw=65,bh=23,gx=9,gy=10,sx=(FW-(cols*bw+(cols-1)*gx))/2,result=[];for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){if(level>1&&(r+c+level)%17===0)continue;result.push({x:Math.trunc(sx+c*(bw+gx)),y:105+r*(bh+gy),w:bw,h:bh,color:colors[Math.min(r,5)].slice(),hp:r===0&&level>=2&&c%3===0?2:1,score:50+(rows-r)*10});}return result;}
function fresh(){const px=FW/2;return {level:1,score:0,lives:3,px,bx:px,by:PY-18,vx:0,vy:0,attached:true,bricks:buildLevel(1),paused:false,over:false,won:false};}
let g=fresh(),keys={left:false,right:false},last=performance.now();
function launch(){if(g.attached&&!g.over&&!g.won){g.attached=false;const speed=330;g.vx=(Math.random()<.5?-.38:.38)*speed;g.vy=-Math.sqrt(speed*speed-g.vx*g.vx);}}
function circleRect(cx,cy,r,b){const qx=clamp(cx,b.x,b.x+b.w),qy=clamp(cy,b.y,b.y+b.h);return (cx-qx)**2+(cy-qy)**2<=r*r;}
function update(dt){if(g.paused||g.over||g.won)return;const direction=(keys.right?1:0)-(keys.left?1:0);g.px=clamp(g.px+direction*520*dt,64,FW-64);if(g.attached){g.bx=g.px;g.by=PY-18;return;}let {bx,by,vx,vy}=g;const steps=Math.max(1,Math.floor(Math.max(Math.abs(vx),Math.abs(vy))*dt/7)+1),sd=dt/steps;
 for(let step=0;step<steps;step++){bx+=vx*sd;by+=vy*sd;if(bx-9<7){bx=16;vx=Math.abs(vx);}else if(bx+9>FW-7){bx=FW-16;vx=-Math.abs(vx);}if(by-9<7){by=16;vy=Math.abs(vy);}const paddle={x:g.px-56,y:PY-8,w:112,h:27};if(vy>0&&circleRect(bx,by,9,paddle)){by=paddle.y-9;const offset=clamp((bx-g.px)/56,-.92,.92),speed=clamp(Math.hypot(vx,vy)*1.015,330,490),angle=offset*1.05;vx=Math.sin(angle)*speed;vy=-Math.cos(angle)*speed;}
 for(const brick of g.bricks.slice()){if(circleRect(bx,by,9,brick)){const oldx=bx-vx*sd;if(oldx+9<=brick.x||oldx-9>=brick.x+brick.w)vx=-vx;else vy=-vy;brick.hp--;if(brick.hp<=0){g.score+=brick.score;g.bricks.splice(g.bricks.indexOf(brick),1);}else brick.color=mix(brick.color,WHITE,.18);break;}}
 if(by>FH+25){g.lives--;if(g.lives<=0)g.over=true;else{g.bx=g.px;g.by=PY-18;g.vx=0;g.vy=0;g.attached=true;}return;}}
 g.bx=bx;g.by=by;g.vx=vx;g.vy=vy;if(!g.bricks.length){if(g.level>=3)g.won=true;else{g.level++;g.bricks=buildLevel(g.level);g.px=FW/2;g.bx=g.px;g.by=PY-18;g.vx=0;g.vy=0;g.attached=true;}}}
function drawBrick(b){const top=polyRect(b.x,b.y,b.w,b.h),low=polyRect(b.x,b.y+7,b.w,b.h),col=b.color;polygon(low.map(([a,c])=>[a+3,c+7]),'#051e27');polygon(low,rgb(col));polygon(top,rgb(mix(col,WHITE,.34)));polygon([top[1],top[2],low[2],low[1]],rgb(mix(col,[0,0,0],.3)));polygon(low,null,'#182c33',1);if(b.hp>1){const cx=low.reduce((s,p)=>s+p[0],0)/4,cy=low.reduce((s,p)=>s+p[1],0)/4;line([cx-5,cy],[cx+5,cy],'#fff',2);}}
function drawPaddle(){const x=g.px-56,p=polyRect(x,PY,112,17);polygon(p.map(([a,b])=>[a+2,b+7]),'#041a21');polygon(p,'#207585',rgb(CYAN),3);line(project(x+20,PY+4),project(x+92,PY+4),'#cdfff6',3);for(const sx of [x+9,x+103]){const [cx,cy]=project(sx,PY+8);ctx.fillStyle=rgb(GOLD);ctx.beginPath();ctx.arc(cx,cy,4,0,Math.PI*2);ctx.fill();}}
function drawBall(){const [x,y]=project(g.bx,g.by);ctx.fillStyle='#05262c';ctx.beginPath();ctx.ellipse(x,y+11,11,4,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffe18b';ctx.beginPath();ctx.arc(x,y,12,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffffeb';ctx.beginPath();ctx.arc(x-2,y-2,9,0,Math.PI*2);ctx.fill();ctx.fillStyle='#6fe0dd';ctx.beginPath();ctx.arc(x+3,y+3,3,0,Math.PI*2);ctx.fill();}
function overlay(title,sub){ctx.fillStyle='rgba(0,8,16,.72)';ctx.fillRect(0,0,W,H);drawText(title,64,rgb(GOLD),W/2,H/2-35,'center','bold');drawText(sub,25,rgb(WHITE),W/2,H/2+25,'center');}
function render(){background();for(const b of g.bricks)drawBrick(b);drawPaddle();drawBall();ctx.fillStyle='#0b222c';roundRect(45,20,870,58,12);ctx.strokeStyle='#32979f';ctx.lineWidth=2;roundRect(45,20,870,58,12,true);drawText('ARKANOID',25,rgb(CYAN),66,49,'left','bold');drawText(`SCORE  ${String(g.score).padStart(6,'0')}`,24,rgb(WHITE),330,49);drawText(`LIVES  ${g.lives}`,24,rgb(GOLD),625,49);drawText(`LEVEL  ${g.level}`,24,rgb(WHITE),790,49);drawText('ARROWS / A-D MOVE     SPACE LAUNCH     P PAUSE     R RESTART',17,'#aad3cd',W/2,690,'center');if(g.paused)overlay('PAUSED','Press P to continue');else if(g.over)overlay('GAME OVER','Press R to restart');else if(g.won)overlay('YOU WIN!','Prototype cleared - Press R');else if(g.attached)drawText('PRESS SPACE OR TAP TO LAUNCH',24,rgb(GOLD),W/2,615,'center');}
function roundRect(x,y,w,h,r,stroke=false){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(stroke)ctx.stroke();else ctx.fill();}
function frame(now){const dt=Math.min((now-last)/1000,.033);last=now;update(dt);render();requestAnimationFrame(frame);}requestAnimationFrame(frame);
function pointerPosition(e){const rect=canvas.getBoundingClientRect(),mx=(e.clientX-rect.left)*W/rect.width,my=(e.clientY-rect.top)*H/rect.height,t=clamp((my-105)/(FH*.91),0,1),half=315+90*t,logical=((mx-W/2)/(2*half)+.5)*FW;g.px=clamp(logical,64,FW-64);}
canvas.addEventListener('pointermove',e=>{if(e.pointerType==='touch'||e.buttons)pointerPosition(e);});canvas.addEventListener('pointerdown',e=>{pointerPosition(e);if(g.attached)launch();});
window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowleft','arrowright',' ','a','d'].includes(k))e.preventDefault();if(k==='arrowleft'||k==='a')keys.left=true;if(k==='arrowright'||k==='d')keys.right=true;if(k===' '){launch();}if(k==='p'&&!g.over&&!g.won)g.paused=!g.paused;if(k==='r')g=fresh();});window.addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k==='arrowleft'||k==='a')keys.left=false;if(k==='arrowright'||k==='d')keys.right=false;});
function holdButton(id,dir){const el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventDefault();if(dir==='launch')launch();else keys[dir]=true;el.setPointerCapture(e.pointerId);});for(const ev of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(ev,()=>{if(dir!=='launch')keys[dir]=false;});}
holdButton('left','left');holdButton('right','right');holdButton('launch','launch');
})();
</script></body></html>
