<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Cube Castle Smash</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0a1030;--fg:#f4f1de;--gold:#ffd23f;--red:#ff4d4d}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:"Press Start 2P",ui-monospace,Menlo,monospace;color:var(--fg);touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%}
#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 0;font-size:clamp(8px,2.6vw,14px);text-shadow:2px 2px #000;pointer-events:none}
#hud b{color:var(--gold);font-weight:400}
#pop,#big{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);pointer-events:none;opacity:0;white-space:nowrap;text-shadow:3px 3px #000,0 0 14px currentColor}
#pop{font-size:clamp(22px,7vw,44px)}
#big{font-size:clamp(26px,9vw,76px);color:var(--gold);top:30%}
.go{animation:pop .7s ease-out}
@keyframes pop{0%{opacity:1;transform:translate(-50%,-50%) scale(.3)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.25)}100%{opacity:0;transform:translate(-50%,-95%) scale(1)}}
.go2{animation:boom 1.3s steps(12) forwards}
@keyframes boom{0%{opacity:1;transform:translate(-50%,-50%) scale(.2)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.5)}70%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.6)}}
#fl{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none}
.fl{animation:fl .28s ease-out}
@keyframes fl{0%{opacity:.75}100%{opacity:0}}
#tip{position:fixed;left:0;right:0;bottom:calc(28px + env(safe-area-inset-bottom,0px));text-align:center;font-size:clamp(10px,3vw,16px);text-shadow:2px 2px #000;pointer-events:none;animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:.2}}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;background:#000b;padding:20px;line-height:1.8}
#ov h1{margin:0;font-size:clamp(18px,5.5vw,38px);color:var(--gold);text-shadow:4px 4px var(--sh,#b5452d)}
#ov p{margin:0;font-size:clamp(9px,2.4vw,13px);max-width:520px;white-space:pre-line}
button{font:inherit;font-size:clamp(12px,3.2vw,18px);padding:14px 22px;background:var(--gold);color:#222;border:0;box-shadow:0 5px var(--sh,#b5452d);cursor:pointer}
button:active{transform:translateY(4px);box-shadow:0 1px var(--sh,#b5452d)}
.hide{display:none!important}canvas{image-rendering:pixelated}#ov{overflow-y:auto;justify-content:safe center}#th{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}#th::before{content:"THEME";width:100%;font-size:clamp(8px,2.4vw,11px)}#th button{font-size:clamp(8px,2.6vw,13px);padding:10px 12px;opacity:.5}#th button.on{opacity:1;outline:3px solid var(--fg)}#crt{position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(#0000 0 2px,#0003 2px 3px),radial-gradient(#0000 55%,#000b)}#st{position:fixed;left:0;right:0;top:calc(34px + env(safe-area-inset-top,0px));text-align:center;font-size:clamp(7px,2.2vw,11px);color:#7fe9ff;text-shadow:2px 2px #000;pointer-events:none}
</style></head><body>
<canvas id="c"></canvas>
<div id="fl"></div><div id="crt"></div><div id="st"></div>
<div id="hud"><span>SCORE <b id="sc">000000</b></span><span id="lv"></span><span id="lf"></span></div>
<div id="pop"></div><div id="big"></div><div id="tip">TAP TO LAUNCH</div>
<div id="ov"><h1 id="t"></h1><p id="s"></p><div id="th"></div><button id="b"></button><button id="sh" class="hide">SHARE SCORE</button></div>
<script src="https://telegram.org/js/telegram-web-app.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

(()=>{
